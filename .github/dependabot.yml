version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps the SHA-pinned actions in .github/workflows moving; without this a
  # pinned action stays on whichever commit it was pinned to forever.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
